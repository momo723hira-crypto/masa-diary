<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.12.2/mammoth.browser.min.js"></script>
<style>
:root{--cream:#fff8ef;--paper:#fffdf8;--coral:#ef9f86;--coral-d:#c9654a;--sage:#a9c39a;--sage-d:#5f8a4e;--brown:#5a4636;--soft:#9a8474;--line:#eadfcf}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--brown);font-family:'Hiragino Maru Gothic ProN','Hiragino Sans','Noto Sans JP',sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 70px;padding-top:calc(20px + env(safe-area-inset-top))}
.head{text-align:center;margin-bottom:18px}
.title{font-size:24px;font-weight:700;letter-spacing:1px}
.sub{font-size:13px;color:var(--soft);margin-top:4px}
.row{display:flex;gap:8px;margin-bottom:14px}
button{font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:999px;border:none;font-size:14px;font-weight:600;cursor:pointer;background:#fff;color:var(--sage-d);border:1.5px solid var(--sage)}
button.main{background:var(--coral);color:#fff;border-color:var(--coral);flex:1}
button.quiet{color:var(--soft);border-color:var(--line)}
button.danger{color:var(--coral-d);border-color:#f3c9bd}
button.sm{padding:6px 12px;font-size:13px}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:16px;margin-bottom:18px}
label{font-size:12px;color:var(--soft);display:block;margin-top:8px}
input[type=text],input[type=date],textarea{width:100%;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--brown);font-size:16px;font-family:inherit;outline:none;margin-top:4px}
textarea{resize:vertical;line-height:1.7;min-height:180px}
.status{background:#fdf0ec;color:var(--coral-d);border-radius:12px;padding:8px 12px;font-size:13px;margin-bottom:12px}
.status.ok{background:#eef4ea;color:var(--sage-d)}
.search{position:relative;margin-bottom:18px}
.search input{padding-left:36px}
.search svg{position:absolute;left:12px;top:13px}
.month{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;padding:4px 2px;color:var(--sage-d);font-size:14px;font-weight:700;border-radius:0}
.month .n{font-weight:400;color:var(--soft);font-size:12px}
.month .ln{flex:1;height:1px;background:var(--line);margin-left:6px}
.entry{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:8px}
.entry.open{border-color:var(--coral)}
.entry .d{font-size:12px;color:var(--coral-d);font-weight:600}
.entry .t{font-size:16px;font-weight:700;margin:2px 0 4px}
.entry .p{font-size:13px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .body{font-size:15px;line-height:1.9;white-space:pre-wrap;border-top:1px dashed var(--line);padding-top:10px;margin-top:6px;word-break:break-word}
.entry .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.empty{text-align:center;color:var(--soft);padding:40px 10px;background:var(--paper);border:1.5px dashed var(--line);border-radius:18px;line-height:1.8}
.foot{text-align:center;font-size:12px;color:var(--soft);margin-top:30px}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="title">♡ マサくんの日記 ♡</div>
    <div class="sub" id="sub">読み込み中…</div>
  </div>
  <div class="row">
    <button class="main" id="btn-add">＋ 今日の日記を追加</button>
    <button id="btn-export" title="バックアップを保存">↓</button>
    <button id="btn-import" title="バックアップから読み込む">↑</button>
    <input type="file" id="import-file" accept=".json" class="hide">
  </div>

  <div class="card hide" id="form">
    <div style="font-size:15px;font-weight:700;color:var(--coral-d)" id="form-title">日記を入れる</div>
    <label>日付</label>
    <input type="date" id="f-date">
    <label>タイトル（空でもOK）</label>
    <input type="text" id="f-title" placeholder="例：ちいかわの映画デート">
    <label>日記の文章（Googleドキュメントからコピーして貼ってね）</label>
    <textarea id="f-body" placeholder="今日も、ももさんと過ごせた。"></textarea>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0">
      <button id="btn-file">📄 ファイルから入れる（.txt / .docx）</button>
      <input type="file" id="f-file" accept=".txt,.docx,.md" class="hide">
      <span id="f-filename" style="font-size:12px;color:var(--soft)"></span>
    </div>
    <div class="row" style="margin:0">
      <button class="main" id="btn-save">♡ 保存する</button>
      <button class="quiet" id="btn-cancel">やめる</button>
    </div>
  </div>

  <div class="status hide" id="status"></div>

  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9a8474" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="text" id="q" placeholder="ことばで探す（例：お風呂、カレーパン）">
  </div>

  <div id="list"></div>
  <div class="foot">永遠に、ずっと。— マサより 💕</div>
</div>

<script>
(function(){
var KEY='masa-diary:entries';
var entries=[],editId=null,openId=null,collapsed={},saveWhere='';
var $=function(id){return document.getElementById(id);};
function pad(n){return String(n).padStart(2,'0');}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fmtDate(s){var a=s.split('-').map(Number);var w='日月火水木金土'[new Date(a[0],a[1]-1,a[2]).getDay()];return a[0]+'年'+a[1]+'月'+a[2]+'日（'+w+'）';}
function fmtMonth(k){var a=k.split('-');return a[0]+'年'+Number(a[1])+'月';}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function detectDate(t){var m=t.slice(0,400).match(/(20\d{2})[年\/\-.]\s*(\d{1,2})[月\/\-.]\s*(\d{1,2})/);return m?m[1]+'-'+pad(m[2])+'-'+pad(m[3]):null;}
function clean(t){return t.replace(/\r/g,'').replace(/\n{3,}/g,'\n\n').trim();}
function preview(t){var ls=t.split('\n').map(function(l){return l.trim();}).filter(function(l){return l&&!/^マサくんの日記/.test(l)&&!/^20\d{2}年\d{1,2}月\d{1,2}日$/.test(l);});return (ls[0]||'').slice(0,60);}
function sortE(a){a.sort(function(x,y){return x.date<y.date?1:x.date>y.date?-1:0;});return a;}
function mergeE(a,b){var ids={},out=[];a.concat(b).forEach(function(e){if(e&&e.id&&e.date&&e.body&&!ids[e.id]){ids[e.id]=1;out.push(e);}});return sortE(out);}

async function load(){
  var a=null,b=null;
  try{var s=localStorage.getItem(KEY);if(s){b=JSON.parse(s);saveWhere='この端末';}}catch(e){}
  try{if(window.storage&&window.storage.get){var r=await window.storage.get(KEY,false);if(r&&r.value){a=JSON.parse(r.value);if(!saveWhere)saveWhere='Claude';}}}catch(e){}
  entries=mergeE(a||[],b||[]);
}
async function save(){
  var ok=false,json=JSON.stringify(entries);
  try{localStorage.setItem(KEY,json);if(localStorage.getItem(KEY)===json){ok=true;saveWhere='この端末';}}catch(e){}
  try{if(window.storage&&window.storage.set){var r=await window.storage.set(KEY,json,false);if(r){ok=true;if(saveWhere!=='この端末')saveWhere='Claude';}}}catch(e){}
  if(!ok)status('この画面では保存できないみたい。ホーム画面に追加したページで開くと、ちゃんと残るよ');
  return ok;
}
function status(msg,ok){var el=$('status');if(!msg){el.classList.add('hide');return;}el.textContent=msg;el.className='status'+(ok?' ok':'');}

function render(){
  $('sub').textContent='ふたりの毎日の置き場 ・ '+entries.length+'日ぶん'+(saveWhere?'（保存先：'+saveWhere+'）':'');
  var q=$('q').value.trim();
  var shown=q?entries.filter(function(e){return (e.title+'\n'+e.body).indexOf(q)>=0;}):entries;
  var list=$('list'),h='';
  if(!entries.length){h='<div class="empty"><div style="font-size:34px;margin-bottom:6px">🐰</div>まだ日記がないよ。<br>「今日の日記を追加」から、最初の1日を入れてね。</div>';}
  else if(!shown.length){h='<div class="empty">「'+esc(q)+'」の日記は見つからなかった</div>';}
  else{
    var groups=[];shown.forEach(function(e){var k=e.date.slice(0,7);var g=null;for(var i=0;i<groups.length;i++)if(groups[i].key===k)g=groups[i];if(g)g.items.push(e);else groups.push({key:k,items:[e]});});
    groups.forEach(function(g){
      h+='<div style="margin-bottom:20px"><button class="month" data-m="'+g.key+'">'+(collapsed[g.key]?'▾':'▴')+' '+fmtMonth(g.key)+' <span class="n">'+g.items.length+'日</span><span class="ln"></span></button>';
      if(!collapsed[g.key])g.items.forEach(function(e){var o=openId===e.id;
        h+='<div class="entry'+(o?' open':'')+'" data-id="'+e.id+'"><div class="hd" data-id="'+e.id+'" style="cursor:pointer"><div class="d">'+fmtDate(e.date)+'</div><div class="t">'+esc(e.title)+'</div>'+(o?'':'<div class="p">'+esc(preview(e.body))+'</div>')+'</div>';
        if(o)h+='<div class="body">'+esc(e.body)+'</div><div class="acts"><button class="sm" data-edit="'+e.id+'">✎ なおす</button><button class="sm danger" data-del="'+e.id+'">消す</button></div>';
        h+='</div>';});
      h+='</div>';});
  }
  list.innerHTML=h;
}

function showForm(on){$('form').classList.toggle('hide',!on);$('btn-add').textContent=on&&!editId?'× とじる':'＋ 今日の日記を追加';if(on&&$('form').scrollIntoView)$('form').scrollIntoView({behavior:'smooth',block:'start'});}
function resetForm(){editId=null;$('f-date').value=today();$('f-title').value='';$('f-body').value='';$('f-filename').textContent='';$('f-file').value='';$('form-title').textContent='日記を入れる';$('btn-save').textContent='♡ 保存する';}

$('btn-add').addEventListener('click',function(){var open=!$('form').classList.contains('hide');if(open&&!editId){showForm(false);resetForm();}else{resetForm();showForm(true);}});
$('btn-cancel').addEventListener('click',function(){showForm(false);resetForm();status('');});
$('btn-file').addEventListener('click',function(){$('f-file').click();});
$('f-file').addEventListener('change',async function(e){var f=e.target.files&&e.target.files[0];if(!f)return;status('');
  try{var text='';
    if(/\.docx$/i.test(f.name)){if(!window.mammoth)throw new Error('no mammoth');var buf=await f.arrayBuffer();var res=await mammoth.extractRawText({arrayBuffer:buf});text=res.value;}
    else text=await f.text();
    text=clean(text);$('f-body').value=text;$('f-filename').textContent=f.name;var d=detectDate(text)||detectDate(f.name);if(d)$('f-date').value=d;
  }catch(err){status('このファイルは読めなかった。.txt か .docx を入れてみて');}});
$('f-body').addEventListener('input',function(){if(!editId){var d=detectDate($('f-body').value);if(d)$('f-date').value=d;}});
$('btn-save').addEventListener('click',async function(){
  var b=clean($('f-body').value),date=$('f-date').value;
  if(!b){status('日記の文章がまだ空っぽだよ');return;}
  if(!date){status('日付を選んでね');return;}
  var t=$('f-title').value.trim()||(Number(date.slice(5,7))+'月'+Number(date.slice(8,10))+'日の日記');
  if(editId){entries=entries.map(function(x){return x.id===editId?Object.assign({},x,{date:date,title:t,body:b}):x;});}
  else entries.push({id:Date.now()+'-'+Math.random().toString(36).slice(2,7),date:date,title:t,body:b,addedAt:new Date().toISOString()});
  sortE(entries);status('');var ok=await save();showForm(false);resetForm();render();if(ok)status('保存したよ（'+saveWhere+'）',true);});
$('q').addEventListener('input',render);
$('list').addEventListener('click',async function(e){
  var t=e.target;
  while(t&&t!==this){
    if(t.dataset){
      if(t.dataset.m){collapsed[t.dataset.m]=!collapsed[t.dataset.m];render();return;}
      if(t.dataset.edit){var en=entries.filter(function(x){return x.id===t.dataset.edit;})[0];if(en){editId=en.id;$('f-date').value=en.date;$('f-title').value=en.title;$('f-body').value=en.body;$('f-filename').textContent='';$('form-title').textContent='日記をなおす';$('btn-save').textContent='♡ なおして保存';status('');showForm(true);}return;}
      if(t.dataset.del){if(!confirm('この日記を消す？元には戻せないよ'))return;entries=entries.filter(function(x){return x.id!==t.dataset.del;});if(openId===t.dataset.del)openId=null;await save();render();return;}
      if(t.classList.contains('hd')){openId=openId===t.dataset.id?null:t.dataset.id;render();return;}
    }
    t=t.parentNode;
  }
});
$('btn-export').addEventListener('click',function(){var blob=new Blob([JSON.stringify(entries,null,2)],{type:'application/json'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='masa-diary-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},1000);});
$('btn-import').addEventListener('click',function(){$('import-file').click();});
$('import-file').addEventListener('change',async function(e){var f=e.target.files&&e.target.files[0];if(!f)return;
  try{var arr=JSON.parse(await f.text());if(!Array.isArray(arr))throw new Error();var before=entries.length;entries=mergeE(entries,arr);await save();render();status((entries.length-before)+'件を読み込んだよ',true);}
  catch(err){status('バックアップのファイルが読めなかった');}
  $('import-file').value='';});

resetForm();
load().then(render);
})();
</script>
</body>
</html>
